<div class="page-wrapper">
  <div class="content">

    <div class="page-header">
      <div class="row">
        <div class="col-sm-12">
          <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Inicio</a></li>
            <li class="breadcrumb-item"><a [routerLink]="['/egreso/list']">Egresos</a></li>
            <li class="breadcrumb-item active">Editar Egreso #{{ egreso_id }}</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title">Editar Egreso</h4>
            <hr>

            <div *ngIf="text_validation" class="alert alert-danger alert-dismissible fade show">
              {{ text_validation }}
              <button type="button" class="btn-close" (click)="text_validation=''"></button>
            </div>

            <!-- Info de referencia -->
            <div class="alert alert-secondary mb-3">
              <strong>Paciente:</strong> {{ patient_name }} —
              <strong>Ingreso:</strong> {{ fecha_ingreso_ref }}
            </div>

            <div class="row">

              <!-- Fecha de Egreso -->
              <div class="col-12 col-md-6 mb-3">
                <label class="form-label">Fecha y hora de egreso <span class="text-danger">*</span></label>
                <input type="datetime-local" class="form-control" [(ngModel)]="fecha_egreso">
              </div>

              <!-- Tipo de Egreso -->
              <div class="col-12 col-md-6 mb-3">
                <label class="form-label">Tipo de egreso <span class="text-danger">*</span></label>
                <select class="form-select" [(ngModel)]="tipo_egreso">
                  <option value="">-- Seleccione --</option>
                  <option *ngFor="let t of tiposEgreso" [value]="t.value">{{ t.label }}</option>
                </select>
              </div>

              <!-- Diagnóstico Final -->
              <div class="col-12 mb-3">
                <label class="form-label">Diagnóstico final <span class="text-danger">*</span></label>
                <textarea class="form-control" rows="3" [(ngModel)]="diagnostico_final"></textarea>
              </div>

              <!-- Indicaciones -->
              <div class="col-12 mb-3">
                <label class="form-label">Indicaciones al alta</label>
                <textarea class="form-control" rows="3" [(ngModel)]="indicaciones"></textarea>
              </div>

              <!-- Observaciones -->
              <div class="col-12 mb-3">
                <label class="form-label">Observaciones</label>
                <textarea class="form-control" rows="2" [(ngModel)]="observaciones"></textarea>
              </div>

            </div>

            <div class="d-flex justify-content-end gap-2 mt-2">
              <a [routerLink]="['/egreso/list']" class="btn btn-secondary">Cancelar</a>
              <button class="btn btn-primary" (click)="save()" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                Guardar Cambios
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

  </div>
</div>
