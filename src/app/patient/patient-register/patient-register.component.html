<!-- Main Wrapper -->
<div class="main-wrapper login-body">
  <div class="container-fluid px-0">
    <div class="row">
      <!-- Login logo -->
      <div class="col-lg-6 login-wrap">
        <div class="login-sec">
          <div class="log-img">
            <img class="img-fluid" src="assets/img/login-02.png" alt="Logo" />
          </div>
        </div>
      </div>
      <!-- /Login logo -->

      <!-- Register Content -->
      <div class="col-lg-6 login-wrap-bg">
        <div class="login-wrapper" style="overflow-y:auto; max-height:100vh; padding: 20px 0;">
          <div class="loginbox">
            <div class="login-right">
              <div class="login-right-wrap">
                <div class="account-logo">
                  <a routerLink="/"><img src="assets/img/login-logo.png" alt="" /></a>
                </div>
                <h2>Crear Cuenta</h2>
                <p class="account-subtitle mb-3">Regístrate para acceder a tu portal de paciente</p>

                <div class="alert alert-danger  fade show py-2" *ngIf="errorMsg">{{ errorMsg }}</div>
                <div class="alert alert-success fade show py-2" *ngIf="successMsg">{{ successMsg }}</div>

                <form [formGroup]="form" (ngSubmit)="submit()">

                  <div class="row">
                    <div class="col-12 col-md-6">
                      <div class="form-group">
                        <label>Nombres <span class="login-danger">*</span></label>
                        <input class="form-control" type="text" formControlName="name" placeholder="Juan"
                          [ngClass]="{'is-invalid': f['name'].touched && f['name'].invalid}" />
                      </div>
                    </div>
                    <div class="col-12 col-md-6">
                      <div class="form-group">
                        <label>Apellidos <span class="login-danger">*</span></label>
                        <input class="form-control" type="text" formControlName="surname" placeholder="Pérez"
                          [ngClass]="{'is-invalid': f['surname'].touched && f['surname'].invalid}" />
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-12 col-md-6">
                      <div class="form-group">
                        <label>DNI / Documento <span class="login-danger">*</span></label>
                        <input class="form-control" type="text" formControlName="n_document" placeholder="12345678"
                          [ngClass]="{'is-invalid': f['n_document'].touched && f['n_document'].invalid}" />
                      </div>
                    </div>
                    <div class="col-12 col-md-6">
                      <div class="form-group">
                        <label>Teléfono</label>
                        <input class="form-control" type="text" formControlName="mobile" placeholder="987654321" />
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label>Correo electrónico <span class="login-danger">*</span></label>
                    <input class="form-control" type="email" formControlName="email" placeholder="tucorreo@email.com"
                      [ngClass]="{'is-invalid': f['email'].touched && f['email'].invalid}" />
                  </div>

                  <div class="row">
                    <div class="col-12 col-md-6">
                      <div class="form-group">
                        <label>Fecha de nacimiento</label>
                        <input class="form-control" type="date" formControlName="birth_date" />
                      </div>
                    </div>
                    <div class="col-12 col-md-6">
                      <div class="form-group select-gender">
                        <label class="gen-label">Género</label>
                        <div class="form-check-inline">
                          <label class="form-check-label">
                            <input type="radio" formControlName="gender" value="M" class="form-check-input"> Masculino
                          </label>
                        </div>
                        <div class="form-check-inline">
                          <label class="form-check-label">
                            <input type="radio" formControlName="gender" value="F" class="form-check-input"> Femenino
                          </label>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label>Dirección</label>
                    <input class="form-control" type="text" formControlName="address" placeholder="Av. Principal 123" />
                  </div>

                  <div class="form-group">
                    <label>Contraseña <span class="login-danger">*</span></label>
                    <input class="form-control pass-input"
                      [type]="showPassword ? 'text' : 'password'"
                      formControlName="password" placeholder="Mínimo 6 caracteres"
                      [ngClass]="{'is-invalid': f['password'].touched && f['password'].invalid}" />
                    <span (click)="showPassword = !showPassword"
                      [ngClass]="showPassword ? 'feather icon-eye' : 'feather icon-eye-off'"
                      class="profile-views toggle-password"></span>
                    <div class="invalid-feedback" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
                      Mínimo 6 caracteres.
                    </div>
                  </div>

                  <div class="form-group login-btn">
                    <button [disabled]="form.invalid || loading" class="btn btn-primary btn-block" type="submit">
                      <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                      Crear Cuenta
                    </button>
                  </div>
                </form>

                <div class="next-sign">
                  <p class="account-subtitle">
                    ¿Ya tienes cuenta? <a routerLink="/patient/login">Iniciar sesión</a>
                  </p>
                  <p class="account-subtitle">
                    <a routerLink="/" class="text-muted">← Volver al inicio</a>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- /Register Content -->
    </div>
  </div>
</div>
<!-- /Main Wrapper -->
