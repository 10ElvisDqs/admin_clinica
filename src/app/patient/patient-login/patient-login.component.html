<!-- Main Wrapper -->
<div class="main-wrapper login-body">
  <div class="container-fluid px-0">
    <div class="row">
      <!-- Login logo -->
      <div class="col-lg-6 login-wrap">
        <div class="login-sec">
          <div class="log-img">
            <img class="img-fluid" src="assets/img/login-02.png" alt="Logo" />
          </div>
        </div>
      </div>
      <!-- /Login logo -->

      <!-- Login Content -->
      <div class="col-lg-6 login-wrap-bg">
        <div class="login-wrapper">
          <div class="loginbox">
            <div class="login-right">
              <div class="login-right-wrap">
                <div class="account-logo">
                  <a routerLink="/"><img src="assets/img/login-logo.png" alt="" /></a>
                </div>
                <h2>Portal del Paciente</h2>
                <p class="account-subtitle mb-3">Ingresa con tu cuenta de paciente</p>

                <!-- Error -->
                <div class="alert alert-danger alert-dismissible fade show" role="alert" *ngIf="errorMsg">
                  <strong>Error!</strong> {{ errorMsg }}
                </div>

                <!-- Form -->
                <form [formGroup]="form" (ngSubmit)="submit()">
                  <div class="form-group">
                    <label>Correo electrónico <span class="login-danger">*</span></label>
                    <input class="form-control" formControlName="email" type="email" placeholder="tucorreo@email.com"
                      [ngClass]="{'is-invalid': f['email'].touched && f['email'].invalid}" />
                  </div>
                  <div class="form-group">
                    <label>Contraseña <span class="login-danger">*</span></label>
                    <input class="form-control pass-input"
                      [type]="showPassword ? 'text' : 'password'"
                      formControlName="password" placeholder="••••••••"
                      [ngClass]="{'is-invalid': f['password'].touched && f['password'].invalid}" />
                    <span (click)="showPassword = !showPassword"
                      [ngClass]="showPassword ? 'feather icon-eye' : 'feather icon-eye-off'"
                      class="profile-views toggle-password"></span>
                  </div>
                  <div class="form-group login-btn">
                    <button [disabled]="form.invalid || loading" class="btn btn-primary btn-block" type="submit">
                      <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                      Iniciar Sesión
                    </button>
                  </div>
                </form>
                <!-- /Form -->

                <div class="next-sign">
                  <p class="account-subtitle">
                    ¿No tienes cuenta?
                    <a routerLink="/patient/register">Regístrate aquí</a>
                  </p>
                  <p class="account-subtitle">
                    <a routerLink="/" class="text-muted">← Volver al inicio</a>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- /Login Content -->
    </div>
  </div>
</div>
<!-- /Main Wrapper -->
